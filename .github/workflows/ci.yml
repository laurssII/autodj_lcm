# Guardar como .github/workflows/ci.yml
#
# SUPUESTOS (ajusta lo que no coincida con tu repo):
#   - backend en ./backend, con requirements.txt (o pyproject) y tests en backend/tests
#   - frontend Angular en ./frontend, con package-lock.json
#   - los tests no necesitan claves de IA ni red (los de IA usan proveedores simulados)
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # Librerías de sistema para audio (Rubber Band, ffmpeg, libsndfile)
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg rubberband-cli libsndfile1

      # Si requirements.txt incluye torch/demucs la instalación es pesada:
      # en ese caso separa un requirements-dev.txt sin Demucs para CI.
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Tests
        env:
          # Sin claves: el DJ debe funcionar en modo reserva
          GROQ_API_KEY: ""
          GEMINI_API_KEY: ""
          GITHUB_TOKEN: ""
        run: python -m pytest -q

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx ng build

  docker:
    name: Docker Compose (config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose
        run: |
          cp -n .env.example .env || true
          docker compose config -q
