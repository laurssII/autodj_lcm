<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>AutoDJ</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2efe9" />
    <script>
      /* Aplica el tema antes de pintar nada: lo guardado, o el del sistema. */
      (function () {
        var t = null;
        try { t = localStorage.getItem('autodj-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#0d0d12' : '#f2efe9');
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='14' width='5' height='13' rx='1' fill='%23e8512c'/%3E%3Crect x='13' y='5' width='5' height='22' rx='1' fill='%23e8512c'/%3E%3Crect x='21' y='10' width='5' height='17' rx='1' fill='%23e8512c'/%3E%3C/svg%3E" />
  </head>
  <body>
    <dj-root></dj-root>
  </body>
</html>
